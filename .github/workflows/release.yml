name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore signing key
        if: ${{ secrets.VEIL_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.VEIL_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/veil-release.jks"
          {
            echo "VEIL_KEYSTORE=$RUNNER_TEMP/veil-release.jks"
            echo "VEIL_KEYSTORE_PASSWORD=${{ secrets.VEIL_KEYSTORE_PASSWORD }}"
            echo "VEIL_KEY_ALIAS=${{ secrets.VEIL_KEY_ALIAS }}"
            echo "VEIL_KEY_PASSWORD=${{ secrets.VEIL_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Build release APKs (arm64-v8a, x86_64, universal)
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:assembleRelease -PabiSplits --no-daemon

      - name: Collect APKs
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 'versionName =' composeApp/build.gradle.kts | cut -d'"' -f2)"
          mkdir -p out
          SRC=composeApp/build/outputs/apk/release
          cp "$SRC/composeApp-arm64-v8a-release.apk"  "out/veil-$VERSION-arm64-v8a.apk"
          cp "$SRC/composeApp-x86_64-release.apk"     "out/veil-$VERSION-x86_64.apk"
          cp "$SRC/composeApp-universal-release.apk"  "out/veil-$VERSION-universal.apk"
          ls -lh out

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
          draft: false
