name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK: $SDK"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Restore signing key
        env:
          KEY_B64: ${{ secrets.VEIL_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.VEIL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VEIL_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.VEIL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEY_B64:-}" ]; then
            printf '%s' "$KEY_B64" | base64 -d > "$RUNNER_TEMP/veil-release.jks"
            {
              echo "VEIL_KEYSTORE=$RUNNER_TEMP/veil-release.jks"
              echo "VEIL_KEYSTORE_PASSWORD=$KEY_PASSWORD"
              echo "VEIL_KEY_ALIAS=$KEY_ALIAS"
              echo "VEIL_KEY_PASSWORD=$KEY_PASS"
            } >> "$GITHUB_ENV"
            echo "Release key restored"
          else
            echo "No signing key secret: release will be debug-signed"
          fi

      - name: Build release APKs
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:assembleRelease -PabiSplits --no-daemon

      - name: Collect APKs
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 'versionName =' composeApp/build.gradle.kts | cut -d'"' -f2)"
          mkdir -p out
          SRC=composeApp/build/outputs/apk/release
          cp "$SRC/composeApp-arm64-v8a-release.apk"  "out/veil-$VERSION-arm64-v8a.apk"
          cp "$SRC/composeApp-x86_64-release.apk"     "out/veil-$VERSION-x86_64.apk"
          cp "$SRC/composeApp-universal-release.apk"  "out/veil-$VERSION-universal.apk"
          ls -lh out

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
          draft: false
