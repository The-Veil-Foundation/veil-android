name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (v0.1.1)'
        required: true
      draft:
        description: 'Create as draft'
        type: boolean
        default: false

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK: $SDK"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Check versions match
        run: |
          set -euo pipefail
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
           TAG_VERSION="$RELEASE_TAG"
          TAG_VERSION="${TAG_VERSION#v}"
          echo "VERSION: $FILE_VERSION"
          echo "tag:     $TAG_VERSION"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::VERSION ($FILE_VERSION) не совпадает с тегом ($TAG_VERSION). Обнови файл VERSION в корне репозитория."
            exit 1
          fi

      - name: Restore signing key
        env:
          KEY_B64: ${{ secrets.VEIL_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.VEIL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VEIL_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.VEIL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEY_B64:-}" ]; then
            printf '%s' "$KEY_B64" | base64 -d > "$RUNNER_TEMP/veil-release.jks"
            {
              echo "VEIL_KEYSTORE=$RUNNER_TEMP/veil-release.jks"
              echo "VEIL_KEYSTORE_PASSWORD=$KEY_PASSWORD"
              echo "VEIL_KEY_ALIAS=$KEY_ALIAS"
              echo "VEIL_KEY_PASSWORD=$KEY_PASS"
            } >> "$GITHUB_ENV"
            echo "Release key restored"
          else
            echo "::error::Release signing key is required"
            exit 1
          fi

      - name: Build release APKs
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:assembleRelease -PabiSplits --no-daemon
          mkdir -p out
          cp composeApp/build/outputs/apk/release/composeApp-*-release.apk out/
          ./gradlew :composeApp:assembleRelease --no-daemon

      - name: Collect APKs
        run: |
          set -euo pipefail
          VERSION="$RELEASE_TAG"
          VERSION="${VERSION#v}"
          mkdir -p out
          SRC=composeApp/build/outputs/apk/release
          mv out/composeApp-armeabi-v7a-release.apk "out/veil-$VERSION-armeabi-v7a.apk"
          mv out/composeApp-arm64-v8a-release.apk "out/veil-$VERSION-arm64-v8a.apk"
          mv out/composeApp-x86_64-release.apk "out/veil-$VERSION-x86_64.apk"
          cp "$SRC/composeApp-release.apk" "out/veil-$VERSION-universal.apk"
          (cd out && sha256sum *.apk > SHA256SUMS)
          ls -lh out

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body_path: docs/releases/${{ env.RELEASE_TAG }}.md
          files: |
            out/*.apk
            out/SHA256SUMS
          draft: ${{ inputs.draft || false }}
